<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style id="app-style">
  :root { --c:#00e5ff; --c2:#7fe9ff; --line:rgba(0,229,255,.35); --bg:#02090d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; color:#aef4ff; overflow:hidden;
         font-family: "Share Tech Mono", ui-monospace, "Courier New", monospace;
         background: radial-gradient(circle at 50% 48%, #05242e 0%, #03121a 40%, var(--bg) 78%); }
  body::before { content:""; position:fixed; inset:0; pointer-events:none;
         background-image: linear-gradient(rgba(0,229,255,.05) 1px, transparent 1px),
                           linear-gradient(90deg, rgba(0,229,255,.05) 1px, transparent 1px);
         background-size: 42px 42px; }
  .hud { position:relative; width:100%; max-width:100vw; overflow:hidden; display:grid; grid-template-rows:auto 1fr auto; height:100vh; height:100dvh; padding:14px 22px 12px; gap:8px; }
  header { display:flex; justify-content:space-between; align-items:flex-start; }
  .clock small { display:block; font-size:10px; letter-spacing:3px; opacity:.6; }
  #clock { font-size:30px; letter-spacing:3px; color:var(--c); text-shadow:0 0 12px var(--c); }
  .topright { text-align:right; font-size:10px; letter-spacing:2px; line-height:1.7; opacity:.75; }
  .topright div:first-child { color:var(--c); opacity:1; }
  main { display:grid; grid-template-columns:minmax(220px,310px) 1fr minmax(190px,260px); gap:24px; align-items:center; min-height:0; }
  .panel { position:relative; border:1px solid var(--line); background:rgba(0,229,255,.04); padding:12px; box-shadow: inset 0 0 24px rgba(0,229,255,.05); }
  .panel::before, .panel::after { content:""; position:absolute; width:12px; height:12px; border:2px solid var(--c); }
  .panel::before { top:-1px; left:-1px; border-right:0; border-bottom:0; }
  .panel::after { bottom:-1px; right:-1px; border-left:0; border-top:0; }
  .panel h3 { margin:0 0 8px; font-size:10px; font-weight:400; letter-spacing:3px; color:var(--c); }
  .left { height:min(62vh,470px); display:flex; flex-direction:column; }
  #log { flex:1; overflow-y:auto; font-size:12px; padding-right:4px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .msg { margin:7px 0; padding:4px 8px; border-inline-start:2px solid var(--line); line-height:1.65; word-break:break-word; font-family:ui-monospace,"Courier New","Noto Naskh Arabic","Noto Sans Arabic",monospace; }
  .msg::before { display:block; font-size:9px; letter-spacing:2px; opacity:.55; }
  .you { border-inline-start-color:#ffffff66; color:#e4f9ff; }
  .you::before { content:"YOU"; }
  .jarvis { border-inline-start-color:var(--c); color:var(--c2); }
  .jarvis::before { content:"JARVIS"; }
  .msg a { color:#7fd0ff; }
  #stats { list-style:none; margin:0; padding:0; font-size:11px; letter-spacing:1px; }
  #stats li { display:grid; grid-template-columns:1fr auto; gap:2px 8px; padding:9px 0; border-bottom:1px solid rgba(0,229,255,.12); }
  #stats li span { opacity:.6; letter-spacing:2px; font-size:10px; }
  #stats li b { font-weight:400; color:var(--c); }
  #stats li i { grid-column:1 / -1; height:2px; background:rgba(0,229,255,.15); }
  #stats li u { display:block; height:100%; width:18%; background:var(--c); box-shadow:0 0 8px var(--c); transition:width .4s; }
  .core { position:relative; width:min(48vh,360px); aspect-ratio:1; margin:0 auto; display:grid; place-items:center; }
  .ring { position:absolute; border-radius:50%; border:1px solid rgba(0,229,255,.22); }
  .r1 { inset:-14%; border-style:dashed; opacity:.5; animation:spin 60s linear infinite reverse; }
  .r2 { inset:0; }
  .r3 { inset:12%; border:2px solid transparent; border-top-color:var(--c); border-left-color:rgba(0,229,255,.4); animation:spin 7s linear infinite; }
  .r4 { inset:22%; border-color:rgba(0,229,255,.35); }
  .orbit { position:absolute; inset:0; animation:spin 11s linear infinite; }
  .orbit span { position:absolute; top:-4px; left:50%; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c); }
  .orb { width:42%; aspect-ratio:1; border-radius:50%; border:0; cursor:pointer; color:#00323b; font-family:inherit; font-weight:700; font-size:clamp(14px,2.2vw,20px); letter-spacing:4px;
         background:radial-gradient(circle at 50% 38%, #7ffaff, #00d4ec 55%, #00a3ba);
         box-shadow:0 0 36px var(--c), 0 0 90px rgba(0,229,255,.45); animation:breathe 4s ease-in-out infinite; }
  #orbState { position:absolute; bottom:-30px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:4px; color:var(--c2); }
  .core[data-state=listening] .orb { animation:pulse .8s ease-in-out infinite; }
  .core[data-state=listening] .r2 { border-color:var(--c); }
  .core[data-state=thinking] .r3 { animation-duration:.9s; }
  .core[data-state=thinking] .orbit { animation-duration:2.2s; }
  .core[data-state=speaking] .orb { animation:talk .32s ease-in-out infinite alternate; }
  .core[data-state=standby] .orb { animation-duration:2.4s; }
  footer { width:100%; max-width:780px; margin:0 auto; padding-top:26px; }
  #status { text-align:center; font-size:11px; letter-spacing:2px; color:var(--c2); min-height:16px; margin-bottom:6px; }
  #keybox { display:none; gap:8px; margin-bottom:8px; }
  #voicebox { display:none; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  select { flex:1; min-width:0; padding:10px; background:rgba(0,229,255,.05); border:1px solid var(--line); color:#e4f9ff; font:inherit; font-size:12px; outline:none; }
  select option { background:#04181f; color:#e4f9ff; }
  button.sel { background:var(--c); color:#00323b; border-color:var(--c); }
  button.sel:hover { background:var(--c); }
  #bar { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:11px 12px; background:rgba(0,229,255,.05); border:1px solid var(--line); color:#e4f9ff; font:inherit; font-size:13px; outline:none; }
  input:focus { border-color:var(--c); box-shadow:0 0 10px rgba(0,229,255,.3); }
  input::placeholder { color:rgba(174,244,255,.4); }
  button { padding:10px 14px; background:transparent; border:1px solid var(--line); color:var(--c); font:inherit; font-size:12px; letter-spacing:1px; cursor:pointer; white-space:nowrap; }
  button:hover { background:rgba(0,229,255,.12); border-color:var(--c); }
  button.listening { background:#ff3b5c; border-color:#ff3b5c; color:#fff; }
  button#hf.on { background:var(--c); color:#00323b; border-color:var(--c); }
  button.orb:hover { background:radial-gradient(circle at 50% 38%, #7ffaff, #00d4ec 55%, #00a3ba); }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes breathe { 50% { transform:scale(1.04); box-shadow:0 0 50px var(--c), 0 0 120px rgba(0,229,255,.5); } }
  @keyframes pulse { 50% { transform:scale(1.09); box-shadow:0 0 60px var(--c), 0 0 140px rgba(0,229,255,.7); } }
  @keyframes talk { from { transform:scale(1); } to { transform:scale(1.1); box-shadow:0 0 64px var(--c), 0 0 130px rgba(0,229,255,.65); } }
  @media (max-width:860px) {
    main { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); gap:34px; align-content:start; }
    .right { display:none; }
    .core { width:min(34vh,250px); order:1; }
    .left { order:2; height:100%; max-height:30vh; }
    #clock { font-size:22px; }
    .hud { padding:12px 12px 10px; }
    #bar { flex-wrap:wrap; }
    #bar input { order:-1; flex:1 1 100%; }
    #bar button { flex:1 1 auto; padding:10px 8px; }
    .left, .core { min-width:0; }
  }
  #extbox { display:none; margin-bottom:8px; padding:10px 12px; border:1px solid var(--line); background:rgba(0,229,255,.04); font-size:12px; line-height:1.6; }
  #extbox .extbtns { display:flex; gap:8px; margin-top:8px; }
  #ext-msg { margin-top:6px; color:var(--c2); }
</style>
</head>
<body>
<template id="page-html">
<div class="hud">
  <header>
    <div class="clock"><small id="date">LOCAL TIME</small><div id="clock">--:--:--</div></div>
    <div class="topright"><div>JARVIS // ONLINE</div><div id="modelLabel">MODEL: --</div><div id="sysline">SYS: READY</div><button id="extbtn" style="margin-top:6px;padding:4px 8px;font-size:10px;letter-spacing:2px">🧩 CHROMEBOOK CONTROL</button></div>
  </header>
  <main>
    <section class="panel left"><h3>TRANSCRIPT</h3><div id="log"></div></section>
    <div class="core" data-state="idle">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
      <div class="orbit"><span></span></div>
      <button id="orb" class="orb" title="Click to talk">JARVIS</button>
      <div id="orbState">STANDBY</div>
    </div>
    <section class="panel right"><h3>SYSTEM STATUS</h3>
      <ul id="stats">
        <li><span>MICROPHONE</span><b id="s-mic">READY</b><i><u id="b-mic"></u></i></li>
        <li><span>VOICE</span><b id="s-voice">IDLE</b><i><u id="b-voice"></u></i></li>
        <li><span>PROCESSING</span><b id="s-brain">IDLE</b><i><u id="b-brain"></u></i></li>
        <li><span>MODEL</span><b id="s-model">--</b><i><u id="b-model" style="width:100%"></u></i></li>
        <li><span>MEMORY</span><b id="s-mem">0 FACTS</b><i><u id="b-mem"></u></i></li>
      </ul>
    </section>
  </main>
  <footer>
    <div id="extbox">
      <div>Controlling tabs, windows and media needs a small Chrome extension. This page can create it for you:</div>
      <div>1) Press Download zip, then right-click the zip in the Files app and choose Extract all (or press Save folder and pick an empty folder, not Downloads itself).</div>
      <div>2) In Chrome open chrome://extensions, turn on Developer mode, click Load unpacked and choose the jarvis-extension folder.</div>
      <div>3) Click the Jarvis icon in the toolbar, or press Alt+Shift+J, and say your commands.</div>
      <div class="extbtns"><button id="ext-zip">Download zip</button><button id="ext-save">Save folder</button></div>
      <div id="ext-msg"></div>
    </div>
    <div id="voicebox">
      <button id="v-boy">👦 Boy</button>
      <button id="v-girl">👧 Girl</button>
      <select id="voiceSel"></select>
      <button id="v-test">Test</button>
    </div>
    <div id="keybox">
      <input id="keyinput" type="password" placeholder="PASTE YOUR GROQ (gsk_...) OR GEMINI (AIza...) KEY">
      <button id="savekey">SAVE</button>
    </div>
    <div id="status"></div>
    <div id="bar">
      <button id="mic">🎤 Talk</button>
      <button id="hf">👂 Hands-free: off</button>
      <input id="text" dir="auto" placeholder="Or type here and press Enter">
      <button id="lang">🌐 Auto</button>
      <button id="vbtn">🔊 Voice</button>
      <button id="key">API key</button>
    </div>
  </footer>
</div>

</template>
<script id="app-src" type="text/plain">
const API = "https://api.groq.com/openai/v1";
// Tried in this order; if one runs out of free quota, the next is used automatically
const PREFERRED = ["openai/gpt-oss-120b", "llama-3.3-70b-versatile", "llama-3.1-8b-instant"];
let activeModel = PREFERRED[0], modelPool = null;
const blockedUntil = {};   // model -> time when we may try it again
const BASE_SYSTEM = "You are Jarvis, a helpful AI assistant. Speak like a standard, neutral AI assistant: polite, clear, factual and to the point, with no jokes, slang or butler-style roleplay. Keep answers short (one to three sentences) because they are read aloud, unless the user asks for detail. Do not use markdown, bullet points, emojis or special symbols. You CAN open websites and apps for the user with the open_anything tool, so never say you cannot open things; call the tool and then confirm briefly. When you set a timer, write its label in the language you are replying in.";

// ---------- Tools: add new abilities here ----------
const TOOLS = [
  { name: "get_time",
    description: "Get the current local date and time.",
    input_schema: { type: "object", properties: {} } },
  { name: "open_anything",
    description: "ALWAYS use this tool when the user asks to open, launch, go to, or search on any website, web app, or app. Native apps are opened as their web versions (calculator, notes, mail, files, music, news and so on). Examples: 'open YouTube', 'open Gmail', 'search YouTube for lofi music', 'open maps for pizza', 'open github.com', 'open calculator'. If you do not know the site, pass the name and it will be searched on Google. Never say you cannot open things; call this tool instead.",
    input_schema: { type: "object",
      properties: {
        target: { type: "string", description: "Site or app name (youtube, gmail, maps, spotify...), a domain like example.com, or a full URL" },
        query: { type: "string", description: "Optional search terms to look up on that site" } },
      required: ["target"] } },
  { name: "get_weather",
    description: "Get current weather and a 3-day forecast for a city. Temperatures are in Celsius. weather_code is a WMO code; describe it in plain words.",
    input_schema: { type: "object",
      properties: { city: { type: "string", description: "City name, e.g. Karachi" } },
      required: ["city"] } },
  { name: "set_timer",
    description: "Set a timer or reminder. Speaks the label aloud when time is up. Only works while this page stays open.",
    input_schema: { type: "object",
      properties: {
        seconds: { type: "number", description: "Time from now in seconds" },
        label: { type: "string", description: "What to say when it fires, e.g. 'Your tea is ready'" } },
      required: ["seconds", "label"] } },
  { name: "remember_fact",
    description: "Save a durable fact or preference about the user so it is remembered in future sessions.",
    input_schema: { type: "object",
      properties: { fact: { type: "string" } }, required: ["fact"] } },
  { name: "forget_fact",
    description: "Delete saved facts that contain the given text.",
    input_schema: { type: "object",
      properties: { match: { type: "string" } }, required: ["match"] } },
  { name: "web_search",
    description: "Search the web for current information, news, or facts you are unsure about.",
    input_schema: { type: "object",
      properties: { query: { type: "string", description: "What to look up" } },
      required: ["query"] } },
];
// ---------- Browser control (only active when running as the Chrome extension) ----------
const IS_EXT = typeof chrome !== "undefined" && !!(chrome.tabs && chrome.runtime && chrome.runtime.id);
const EXT_NOTE = IS_EXT ? " You are running as a Chrome extension in your own small window, and you can control the user's browser with browser_control, switch_tab, list_tabs, close_tabs, media_control, read_page, open_settings, search_history and search_bookmarks. 'This tab' means the user's current browser tab, not your own window. You cannot change system settings such as volume, brightness or Wi-Fi, or lock the screen; for those, open the matching settings page with open_settings and tell the user to change it there. Always call the matching tool for a command, then confirm in a few words." : "";

const SETTINGS_PAGES = {
  settings: "chrome://settings", wifi: "chrome://os-settings/networks?type=WiFi", network: "chrome://os-settings/networks",
  internet: "chrome://os-settings/networks", bluetooth: "chrome://os-settings/bluetoothDevices", display: "chrome://os-settings/display",
  brightness: "chrome://os-settings/display", screen: "chrome://os-settings/display", sound: "chrome://os-settings/audio",
  audio: "chrome://os-settings/audio", volume: "chrome://os-settings/audio", battery: "chrome://os-settings/power",
  power: "chrome://os-settings/power", keyboard: "chrome://os-settings/keyboard", touchpad: "chrome://os-settings/pointer",
  mouse: "chrome://os-settings/pointer", wallpaper: "chrome://personalization", personalization: "chrome://personalization",
  apps: "chrome://os-settings/apps", storage: "chrome://os-settings/storage", accessibility: "chrome://os-settings/osAccessibility",
  language: "chrome://os-settings/osLanguages", languages: "chrome://os-settings/osLanguages", printers: "chrome://os-settings/cupsPrinters",
  privacy: "chrome://os-settings/osPrivacy", date: "chrome://os-settings/dateTime", time: "chrome://os-settings/dateTime",
  update: "chrome://os-settings/help", about: "chrome://os-settings/help", downloads: "chrome://downloads", history: "chrome://history",
  extensions: "chrome://extensions", shortcuts: "chrome://extensions/shortcuts", bookmarks: "chrome://bookmarks",
  passwords: "chrome://password-manager/passwords", flags: "chrome://flags",
};

const EXT_TOOLS = [
  { name: "browser_control",
    description: "Control the user's current browser tab or window. Use for commands like 'close this tab', 'go back', 'reload', 'new tab', 'next tab', 'scroll down', 'zoom in', 'fullscreen', 'take a screenshot', 'bookmark this page', 'new window', 'incognito window'.",
    input_schema: { type: "object", properties: {
      action: { type: "string", enum: ["new_tab", "new_window", "incognito_window", "close_tab", "close_window", "close_other_tabs", "reload", "hard_reload", "back", "forward", "next_tab", "prev_tab", "duplicate_tab", "pin_tab", "unpin_tab", "mute_tab", "unmute_tab", "fullscreen", "exit_fullscreen", "maximize", "minimize", "zoom_in", "zoom_out", "zoom_reset", "scroll_down", "scroll_up", "scroll_top", "scroll_bottom", "screenshot", "bookmark_page"] },
      url: { type: "string", description: "Optional address for new_tab or new_window" } }, required: ["action"] } },
  { name: "list_tabs", description: "List the user's open browser tabs.", input_schema: { type: "object", properties: {} } },
  { name: "switch_tab", description: "Switch to the open tab whose title or address contains the given text.",
    input_schema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] } },
  { name: "close_tabs", description: "Close every open tab whose title or address contains the given text.",
    input_schema: { type: "object", properties: { match: { type: "string" } }, required: ["match"] } },
  { name: "media_control", description: "Control the video or audio playing in the user's current tab (YouTube, Netflix, Spotify web and so on). This changes the player's own volume, not the system volume.",
    input_schema: { type: "object", properties: { action: { type: "string", enum: ["play", "pause", "toggle", "mute", "unmute", "forward", "back", "restart", "faster", "slower", "volume_up", "volume_down"] } }, required: ["action"] } },
  { name: "read_page", description: "Read the title and text of the user's current tab, for summarising or answering questions about it.", input_schema: { type: "object", properties: {} } },
  { name: "open_settings", description: "Open a Chromebook or Chrome settings page, such as wifi, bluetooth, display, brightness, sound, volume, battery, keyboard, touchpad, wallpaper, apps, storage, accessibility, update, downloads, history, extensions, or a built-in Chromebook app (camera, files, gallery, diagnostics, scan). Use this when asked to change a system setting, because Jarvis cannot flip those directly.",
    input_schema: { type: "object", properties: { page: { type: "string" } }, required: ["page"] } },
  { name: "search_history", description: "Search the user's browsing history.", input_schema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] } },
  { name: "search_bookmarks", description: "Search the user's bookmarks.", input_schema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] } },
];
if (IS_EXT) TOOLS.push(...EXT_TOOLS);

let lastNormalWinId = null;
if (IS_EXT) {
  chrome.windows.onFocusChanged.addListener(async id => {
    if (id === chrome.windows.WINDOW_ID_NONE) return;
    try { const w = await chrome.windows.get(id); if (w.type === "normal") lastNormalWinId = id; } catch (e) {}
  });
}
// Jarvis lives in its own small window, so "the current tab" means the last normal browser window
async function pickWindow() {
  const wins = (await chrome.windows.getAll({ populate: true })).filter(w => w.type === "normal");
  if (!wins.length) return null;
  let w = wins.find(x => x.id === lastNormalWinId);
  if (!w) {
    const score = x => Math.max(0, ...(x.tabs || []).map(t => t.lastAccessed || 0));
    w = wins.sort((a, b) => score(b) - score(a))[0];
  }
  return w;
}
async function current() {
  const win = await pickWindow();
  let tab = win && (win.tabs || []).find(t => t.active);
  const own = chrome.runtime.getURL("jarvis.html");
  if (tab && (tab.url || "").startsWith(own)) {     // Jarvis itself is open in a tab: use the user's last other tab
    const others = (win.tabs || []).filter(t => !(t.url || "").startsWith(own));
    tab = others.sort((a, b) => (b.lastAccessed || 0) - (a.lastAccessed || 0))[0] || tab;
  }
  return { win, tab };
}
const need = (x, what) => { if (!x) throw new Error("I can't find a browser " + what + ". Open a Chrome window first."); return x; };
async function inPage(tabId, func, args, allFrames) {
  try { return await chrome.scripting.executeScript({ target: { tabId, allFrames: !!allFrames }, func, args: args || [] }); }
  catch (e) { throw new Error("I can't do that on this kind of page (like chrome:// pages or the Web Store)."); }
}
async function openInBrowser(url) {
  const { win } = await current();
  if (win) await chrome.tabs.create({ windowId: win.id, url, active: true });
  else await chrome.windows.create({ url });
}
async function userTabs() {
  const own = chrome.runtime.getURL("jarvis.html");
  return (await chrome.tabs.query({})).filter(t => !(t.url || "").startsWith(own));
}

const EXT = {
  async browser_control({ action, url }) {
    const { win, tab } = await current();
    switch (action) {
      case "new_tab": await openInBrowser(url || "chrome://newtab/"); return "New tab opened.";
      case "new_window": await chrome.windows.create({ url: url || undefined }); return "New window opened.";
      case "incognito_window":
        try { await chrome.windows.create({ incognito: true, url: url || undefined }); return "Incognito window opened."; }
        catch (e) { return "Chrome blocked it. Turn on 'Allow in Incognito' for the Jarvis extension at chrome://extensions."; }
      case "close_tab": await chrome.tabs.remove(need(tab, "tab").id); return "Tab closed.";
      case "close_window": await chrome.windows.remove(need(win, "window").id); return "Window closed.";
      case "close_other_tabs": {
        const tabs = await chrome.tabs.query({ windowId: need(win, "window").id });
        const ids = tabs.filter(t => !t.active && !t.pinned).map(t => t.id);
        if (ids.length) await chrome.tabs.remove(ids);
        return "Closed " + ids.length + " other tabs.";
      }
      case "reload": await chrome.tabs.reload(need(tab, "tab").id); return "Reloading.";
      case "hard_reload": await chrome.tabs.reload(need(tab, "tab").id, { bypassCache: true }); return "Reloading without the cache.";
      case "back": await chrome.tabs.goBack(need(tab, "tab").id); return "Went back.";
      case "forward": await chrome.tabs.goForward(need(tab, "tab").id); return "Went forward.";
      case "next_tab": case "prev_tab": {
        const tabs = await chrome.tabs.query({ windowId: need(win, "window").id });
        const i = tabs.findIndex(t => t.active);
        const j = (i + (action === "next_tab" ? 1 : -1) + tabs.length) % tabs.length;
        await chrome.tabs.update(tabs[j].id, { active: true });
        return "Switched to " + (tabs[j].title || "the next tab") + ".";
      }
      case "duplicate_tab": await chrome.tabs.duplicate(need(tab, "tab").id); return "Tab duplicated.";
      case "pin_tab": await chrome.tabs.update(need(tab, "tab").id, { pinned: true }); return "Tab pinned.";

function resolveTarget(target, query) {
  const t = (target || "").trim(), q = (query || "").trim();
  if (/^https?:\/\//i.test(t)) return t;
  const key = t.toLowerCase().replace(/^www\./, "").replace(/\.(com|org|net)$/, "").replace(/\s+/g, "");
  const site = SITES[key];
  if (site) return q && site.search ? site.search + encodeURIComponent(q) : site.home;
  if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(t)) return "https://" + t;
  return "https://www.google.com/search?q=" + encodeURIComponent((t + " " + q).trim());
}

  return "Unknown tool.";
}

// ---------- Speech output: sentence queue, so talking can start before the reply is finished ----------
const speechQ = [];
let speakingNow = false, speechHold = 0;
function splitSentences(text) {
  const parts = (text.match(/[^.!?\u06D4\u061F\n]+[.!?\u06D4\u061F]*["')\]]?\s*/g) || [text]).map(s => s.trim()).filter(Boolean);
  const out = [];
  for (const p of parts) {                         // glue very short bits onto the next sentence
    if (out.length && out[out.length - 1].length < 25) out[out.length - 1] += " " + p; else out.push(p);
  }
  return out;
}
function enqueueSpeech(text, fresh) {
  if (fresh) { speechSynthesis.cancel(); stopUrdu(); speechQ.length = 0; }
  text = (text || "").trim();
  if (!text) return;
  speechQ.push(text);
  if (!speaking) { speaking = true; pauseHF(); }
  pumpSpeech();
}
function pumpSpeech() {
  if (speakingNow) return;
  const t = speechQ.shift();
  if (!t) {
    if (speechHold > 0) return;                    // more text is still coming
    if (speaking) { speaking = false; resumeHF(); }
    return;
  }
  speakingNow = true;
  if (isUrdu(t) && !pickVoice(allVoices, VS.preset, t)) {      // no Urdu voice installed: use the online Urdu voice
    speakOnlineUrdu(t).then(() => { speakingNow = false; pumpSpeech(); });
    return;
  }
  const u = new SpeechSynthesisUtterance(t);
  applyVoice(u, t);
  let finished = false;
  const finish = () => { if (finished) return; finished = true; clearTimeout(guard); speakingNow = false; pumpSpeech(); };
  const guard = setTimeout(() => { try { speechSynthesis.cancel(); } catch (e) {} finish(); }, Math.max(6000, t.length * 130));   // some voices never report "finished"
  u.onend = u.onerror = finish;
  try { speechSynthesis.resume(); } catch (e) {}
  speechSynthesis.speak(u);
}
function holdSpeech() { speechHold++; }
function releaseSpeech() { speechHold = Math.max(0, speechHold - 1); pumpSpeech(); }
function speak(text) {
  enqueueSpeech("", true);
  splitSentences(text).forEach(s => enqueueSpeech(s));
}

// Reads Groq's streamed answer, calling onDelta(fullTextSoFar) as words arrive
async function readStream(r, onDelta) {
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = "", content = "";
  const calls = [];
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 1);
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim();
      if (data === "[DONE]") continue;
      let j; try { j = JSON.parse(data); } catch (e) { continue; }
      const d = j.choices && j.choices[0] && j.choices[0].delta;
      if (!d) continue;
      if (d.content) { content += d.content; if (onDelta) onDelta(content); }
      for (const tc of d.tool_calls || []) {
        const i = tc.index == null ? 0 : tc.index;
        calls[i] = calls[i] || { id: "", type: "function", function: { name: "", arguments: "" } };
        if (tc.id) calls[i].id = tc.id;
        if (tc.function && tc.function.name) calls[i].function.name += tc.function.name;
        if (tc.function && tc.function.arguments) calls[i].function.arguments += tc.function.arguments;
      }
    }
  }
  const tool_calls = calls.filter(Boolean);
  return { choices: [{ message: { role: "assistant", content, tool_calls: tool_calls.length ? tool_calls : undefined } }] };
}

// Each Groq model has its own free quota, so when one runs out we try the next.
async function getModelPool() {
  try {
    const r = await fetch(API + "/models", { headers: { Authorization: "Bearer " + getKey() } });
    const j = await r.json();
    const names = (j.data || []).map(m => m.id)
      .filter(n => !/whisper|tts|guard|playai|orpheus|embed|compound|safeguard/.test(n));
    const first = PREFERRED.filter(p => names.includes(p));
    return [...first, ...names.filter(n => !first.includes(n))];
  } catch (e) { return PREFERRED; }
}

const REQ_TIMEOUT_MS = 20000;   // give up on a slow model after 20s and try the next one
// Send only the recent conversation: shorter history = faster replies
function trimmedHistory() {
  if (messages.length <= 20) return messages;
  let last = -1;
  for (let k = messages.length - 1; k >= 0; k--) { if (messages[k].role === "user" && typeof messages[k].content === "string") { last = k; break; } }
  let i = messages.length - 16;
  while (i < messages.length && !(messages[i].role === "user" && typeof messages[i].content === "string")) i++;
  if (i >= messages.length) i = Math.max(last, 0);
  return messages.slice(i);
}

async function callGroq(onDelta) {
  if (!getKey()) { showKeyBox(); throw new Error("Please enter your API key first."); }
  if (!modelPool) modelPool = await getModelPool();
  let lastErr = "";
  for (const m of modelPool) {
    if (Date.now() < (blockedUntil[m] || 0)) continue;
    for (let attempt = 0; attempt < 2; attempt++) {
      const payload = {
        model: m,
        messages: [{ role: "system", content: getSystem() }, ...trimmedHistory()],
        tools: FUNCS,
        tool_choice: "auto",
        max_tokens: 500,
        stream: true,
      };
      if (/gpt-oss/.test(m)) payload.reasoning_effort = "low";   // less thinking = much faster
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), REQ_TIMEOUT_MS);
      let r;
      try {
        r = await fetch(API + "/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + getKey() },
          body: JSON.stringify(payload),
          signal: ctl.signal,
        });
      } catch (e) {                                  // too slow or network error: next model
        clearTimeout(timer);
        blockedUntil[m] = Date.now() + 60000;
        setStatus(m + " slow hai, dusra model try kar raha hun...");
        lastErr = "timeout or network error";
        break;
      }
      clearTimeout(timer);
      if (r.ok) { activeModel = m; if (!handsFree) setStatus(""); return await readStream(r, onDelta); }
      const txt = await r.text();
      lastErr = txt;
      if (r.status === 401) throw new Error("API key galat hai. console.groq.com se nayi key banayein.\n" + txt.slice(0, 200));
      if (r.status === 429) {                       // limit hit: skip this model for a while
        const wait = parseFloat(r.headers.get("retry-after")) || 60;
        blockedUntil[m] = Date.now() + wait * 1000;
        setStatus(m + " ki limit lag gayi, dusra model try kar raha hun...");
        break;
      }
      if (r.status === 404) { blockedUntil[m] = Date.now() + 86400000; break; }
      if (r.status === 500 || r.status === 503) {   // busy: one quick retry, then move on
        if (attempt < 1) { await new Promise(res => setTimeout(res, 1000)); continue; }
        break;
      }
      break;                                        // other errors: try next model
    }
  }
  throw new Error("Abhi koi free model available nahi (limit ya busy). Thori der baad try karein.\n" + lastErr.slice(0, 300));
}

let busy = false, busyStart = 0;
async function send(text) { busy = true; busyStart = Date.now(); try { await sendInner(text); } finally { busy = false; } }
async function sendInnerGroq(text) {
  if (!text) return;
  add("you", text);
  enqueueSpeech("", true);                          // stop anything still being said
  messages.push({ role: "user", content: text });
  holdSpeech();
  try {
    while (true) {
      let live = null, spokenTo = 0;
      const onDelta = full => {                     // show words and speak finished sentences as they arrive
        if (!live) live = addLive();
        live.textContent = full;
        log.scrollTop = log.scrollHeight;
        const rest = full.slice(spokenTo);

// ================= Merged brains and the extension builder =================
async function webSearchGroq(query) {
  try {
    const r = await fetch(API + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + getKey() },
      body: JSON.stringify({ model: "groq/compound", messages: [{ role: "user", content: query }] }),
    });
    if (!r.ok) return "Search failed: " + (await r.text()).slice(0, 200);
    const j = await r.json();
    return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "No results.";
  } catch (e) { return "Search failed: " + e.message; }
}

// ---------- Gemini brain (used when the key starts with AIza) ----------
const GEM_API = "https://generativelanguage.googleapis.com/v1beta/models/";
const GEM_MODEL = "gemini-3.8-flash";   // if Google retires this name, another flash model is found automatically
let gemPool = null, lastProvider = null;
const gemBlocked = {};
function gemFuncs() {
  return TOOLS.map(t => {
    const d = { name: t.name, description: t.description };
    if (Object.keys(t.input_schema.properties || {}).length) d.parameters = t.input_schema;   // Gemini rejects empty parameters
    return d;
  });
}
async function getGemPool() {
  try {
    const r = await fetch(GEM_API.replace(/models\/$/, "models") + "?pageSize=200", { headers: { "x-goog-api-key": getKey() } });
    const j = await r.json();
    const names = (j.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map(m => m.name.replace("models/", ""))
      .filter(n => /gemini/.test(n) && /flash/.test(n) && !/image|tts|live|audio|embed|native|robot|computer/.test(n));
    return [GEM_MODEL, ...names.filter(n => n !== GEM_MODEL)];
  } catch (e) { return [GEM_MODEL]; }
}
const isPlainUserGem = m => m.role === "user" && m.parts && m.parts[0] && m.parts[0].text !== undefined;
function trimmedGem() {                              // send only the recent conversation: faster replies
  if (messages.length <= 20) return messages;
  let last = -1;
  for (let k = messages.length - 1; k >= 0; k--) { if (isPlainUserGem(messages[k])) { last = k; break; } }
  let i = messages.length - 16;
  while (i < messages.length && !isPlainUserGem(messages[i])) i++;
  if (i >= messages.length) i = Math.max(last, 0);
  return messages.slice(i);
}
async function callGemini() {
  if (!getKey()) { showKeyBox(); throw new Error("Please enter your API key first."); }
  const body = JSON.stringify({
    system_instruction: { parts: [{ text: getSystem() }] },
    contents: trimmedGem(),
    tools: [{ function_declarations: gemFuncs() }],
  });
  if (!gemPool) gemPool = await getGemPool();
  let lastErr = "";
  for (const m of gemPool) {
    if (Date.now() < (gemBlocked[m] || 0)) continue;
    for (let attempt = 0; attempt < 2; attempt++) {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), REQ_TIMEOUT_MS);
      let r;
      try {
        r = await fetch(GEM_API + m + ":generateContent", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": getKey() },
          body,
          signal: ctl.signal,
        });
      } catch (e) {
        clearTimeout(timer);
        gemBlocked[m] = Date.now() + 60000;
        setStatus(m + " is slow, trying another model...");
        lastErr = "timeout or network error";
        break;
      }
      clearTimeout(timer);
      if (r.ok) { activeModel = m; if (!handsFree) setStatus(""); return r.json(); }
      const txt = await r.text();
      lastErr = txt;
      if (r.status === 429) {
        const mm = txt.match(/"retryDelay":\s*"(\d+(?:\.\d+)?)s"/);
        gemBlocked[m] = Date.now() + (mm ? +mm[1] : 3600) * 1000;
        setStatus(m + " quota used up, trying another model...");
        break;
      }
      if (r.status === 404) { gemBlocked[m] = Date.now() + 86400000; break; }
      if (r.status === 500 || r.status === 503) {
        if (attempt < 1) { await new Promise(res => setTimeout(res, 1000)); continue; }
        break;
      }
      break;
    }
  }
  throw new Error("No free Gemini model is available right now (quota used up, busy, or the key is wrong). Try again later.\n" + lastErr.slice(0, 300));
}
async function sendInnerGemini(text) {
  if (!text) return;
  add("you", text);
  enqueueSpeech("", true);
  messages.push({ role: "user", parts: [{ text }] });
  try {
    while (true) {
      const resp = await callGemini();
      const content = resp.candidates && resp.candidates[0] && resp.candidates[0].content;
      if (!content || !content.parts) throw new Error("No answer returned. " + JSON.stringify(resp.promptFeedback || (resp.candidates && resp.candidates[0] && resp.candidates[0].finishReason) || ""));
      messages.push(content);
      const calls = content.parts.filter(p => p.functionCall);
      if (!calls.length) {
        const reply = content.parts.map(p => p.text || "").join("");
        add("jarvis", reply);
        speak(reply);
        return;
      }
      const results = [];
      for (const c of calls) {
        const out = await runTool(c.functionCall.name, c.functionCall.args || {});
        results.push({ functionResponse: { name: c.functionCall.name, response: { result: String(out) } } });
      }
      messages.push({ role: "user", parts: results });
    }
  } catch (e) {
    add("jarvis", "Error: " + e.message);
  }
}
async function webSearchGemini(query) {
  try {
    const m = (gemPool && gemPool[0]) || GEM_MODEL;
    const r = await fetch(GEM_API + m + ":generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": getKey() },
      body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: query }] }], tools: [{ google_search: {} }] }),
    });
    if (!r.ok) return "Search failed: " + (await r.text()).slice(0, 200);
    const j = await r.json();
    return ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || "").join("") || "No results.";
  } catch (e) { return "Search failed: " + e.message; }
}

// ---------- Which brain answers ----------
async function sendInner(text) {
  const p = PROVIDER();
  if (p !== lastProvider) { messages.length = 0; modelPool = null; gemPool = null; lastProvider = p; }   // different services keep different chat formats
  return p === "gemini" ? sendInnerGemini(text) : sendInnerGroq(text);
}

const EXT_STATIC = {"manifest.json": "{\n  \"manifest_version\": 3,\n  \"name\": \"Jarvis\",\n  \"version\": \"1.0\",\n  \"description\": \"A voice assistant that opens sites, controls your tabs and windows, and answers questions.\",\n  \"action\": {\n    \"default_title\": \"Open Jarvis\",\n    \"default_icon\": {\n      \"16\": \"icon16.png\",\n      \"48\": \"icon48.png\",\n      \"128\": \"icon128.png\"\n    }\n  },\n  \"icons\": {\n    \"16\": \"icon16.png\",\n    \"48\": \"icon48.png\",\n    \"128\": \"icon128.png\"\n  },\n  \"background\": {\n    \"service_worker\": \"service-worker.js\"\n  },\n  \"permissions\": [\n    \"tabs\",\n    \"scripting\",\n    \"bookmarks\",\n    \"history\",\n    \"downloads\",\n    \"contextMenus\"\n  ],\n  \"host_permissions\": [\n    \"<all_urls>\"\n  ],\n  \"commands\": {\n    \"_execute_action\": {\n      \"suggested_key\": {\n        \"default\": \"Alt+Shift+J\"\n      },\n      \"description\": \"Open Jarvis\"\n    }\n  }\n}", "service-worker.js": "// Opens Jarvis in its own small window when you click the toolbar icon.\nconst PAGE = chrome.runtime.getURL(\"jarvis.html\");\n\nasync function openJarvis() {\n  const tabs = await chrome.tabs.query({ url: PAGE + \"*\" });\n  for (const t of tabs) {                           // already open as the small window? just bring it forward\n    const w = await chrome.windows.get(t.windowId);\n    if (w.type === \"popup\") { await chrome.windows.update(w.id, { focused: true }); return; }\n  }\n  await chrome.windows.create({ url: PAGE, type: \"popup\", width: 460, height: 780 });\n}\n\nchrome.action.onClicked.addListener(openJarvis);\n\nchrome.runtime.onInstalled.addListener(() => {\n  chrome.contextMenus.create({ id: \"mic-setup\", title: \"Allow microphone (open in a tab)\", contexts: [\"action\"] });\n  chrome.tabs.create({ url: PAGE + \"?setup=1\" });   // first run: set up mic and key in a normal tab\n});\n\nchrome.contextMenus.onClicked.addListener(info => {\n  if (info.menuItemId === \"mic-setup\") chrome.tabs.create({ url: PAGE + \"?setup=1\" });\n});\n"};
const CRC_T = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
const toBytes = s => new TextEncoder().encode(s);
function makeZip(files) {                            // a plain (uncompressed) zip file
  const parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = toBytes(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;

  const cdSize = central.reduce((n, p) => n + p.length, 0);

  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}
function iconBytes(size) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const x = c.getContext("2d");
  x.fillStyle = "#03121a"; x.beginPath(); x.arc(size / 2, size / 2, size / 2 - 1, 0, 7); x.fill();
  x.strokeStyle = "#00e5ff"; x.lineWidth = Math.max(1, size * 0.06); x.stroke();
  const g = x.createRadialGradient(size / 2, size * 0.42, size * 0.02, size / 2, size / 2, size * 0.3);
  g.addColorStop(0, "#9ffbff"); g.addColorStop(1, "#00b8d0");
  x.fillStyle = g; x.shadowColor = "#00e5ff"; x.shadowBlur = size * 0.12;
  x.beginPath(); x.arc(size / 2, size / 2, size * 0.28, 0, 7); x.fill();
  const bin = atob(c.toDataURL("image/png").split(",")[1]);
  return Uint8Array.from(bin, ch => ch.charCodeAt(0));
}

  $("ext-save").onclick = async () => {
    try {

    } catch (e) {

  };
}
